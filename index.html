<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Playlist API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .endpoint {
            background: rgba(0,0,0,0.3);
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }
        h3 { color: #00ff88; margin-bottom: 15px; }
        code {
            background: #000;
            padding: 12px 25px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px 0;
            color: #00ff88;
            font-size: 1.1em;
            word-break: break-all;
        }
        .btn {
            background: #00ff88;
            color: #000;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }
        .info {
            margin-top: 30px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 IPTV Playlist API</h1>
        <p class="subtitle">Stream your favorite channels</p>
        
        <div class="endpoint">
            <h3>🔗 Playlist Endpoint</h3>
            <code>https://hub-eight-sigma-54.vercel.app/playlist</code>
            <br><br>
            <a href="/playlist" class="btn">📋 View Playlist</a>
        </div>
        
        <p class="info">Use this URL in VLC, IPTV players, or any M3U-compatible app</p>
    </div>
</body>
</html>
